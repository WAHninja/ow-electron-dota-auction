<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Login - Dota 2 Overlay</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-container">
    <h1>Dota 2 Overlay App</h1>
    <p>Enter your Steam ID to continue</p>
    <input type="text" id="steamIdInput" placeholder="Steam ID (e.g., 76561198...)">
    <button id="loginBtn">Sign In</button>
    <p class="help-text">
      Don't know your Steam ID? 
      <a href="#" id="findSteamId">Find it here</a>
    </p>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
