<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 2 Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Arial, sans-serif;
      color: white;
    }
    
    .overlay-container {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      min-width: 200px;
    }
    
    .overlay-title {
      font-weight: bold;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      padding-bottom: 5px;
    }
    
    .overlay-info {
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="overlay-container">
    <div class="overlay-title">Dota 2 Overlay</div>
    <div class="overlay-info" id="overlayInfo">
      Waiting for game data...
    </div>
  </div>
  <script src="js/overlay.js"></script>
</body>
</html>
